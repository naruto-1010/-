<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <style>
    body { background: #0f172a; }
    input, select, button { -webkit-tap-highlight-color: transparent; }
    .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; } }
  </style>
  <style id="sasunarulog-global-theme">
/* SASUNARU GLOBAL THEME — Sasuke indigo/blue × Naruto orange */
:root {
  color-scheme: dark;
  --sn-blue: #83cfff;
  --sn-blue-strong: #3b82f6;
  --sn-indigo: #312e81;
  --sn-purple: #7c3aed;
  --sn-orange: #fb923c;
  --sn-gold: #fbbf24;
  --sn-panel: rgba(20, 32, 66, .92);
  --sn-panel-soft: rgba(30, 41, 83, .82);
  --sn-border: rgba(125, 184, 255, .35);
}
html { background: #080f25 !important; }
body {
  background:
    radial-gradient(ellipse at 0% 0%, rgba(37, 99, 235, .34), transparent 38%),
    radial-gradient(ellipse at 100% 12%, rgba(249, 115, 22, .20), transparent 32%),
    radial-gradient(ellipse at 75% 100%, rgba(124, 58, 237, .18), transparent 38%),
    linear-gradient(145deg, #080f25 0%, #111b3d 48%, #1b1634 100%) fixed !important;
  background-color: #080f25 !important;
  color: #edf4ff !important;
}
#root { position: relative; isolation: isolate; }
#root::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(circle at 12% 30%, rgba(96, 165, 250, .07), transparent 25%),
              radial-gradient(circle at 88% 58%, rgba(251, 146, 60, .06), transparent 24%);
}
/* Global surfaces: all tabs, cards, forms and history panels */
.bg-slate-950 { background-color: rgba(8, 15, 37, .94) !important; }
.bg-slate-900 { background-color: rgba(15, 25, 57, .96) !important; }
.bg-slate-800 { background-color: rgba(25, 38, 77, .91) !important; }
.bg-slate-700 { background-color: rgba(48, 60, 105, .94) !important; }
.border-slate-700, .border-slate-600 { border-color: rgba(126, 173, 255, .27) !important; }
.bg-blue-950\/50 { background-color: rgba(25, 49, 102, .68) !important; }
.bg-sky-950\/50 { background-color: rgba(17, 57, 105, .70) !important; }
.bg-gradient-to-br.from-slate-950,
.bg-gradient-to-br.from-slate-900,
.bg-gradient-to-br.from-slate-950.via-blue-950,
.bg-gradient-to-br.from-slate-900.via-slate-800 {
  background-image: linear-gradient(135deg, rgba(30, 64, 135, .95), rgba(36, 35, 91, .96) 56%, rgba(105, 54, 35, .78)) !important;
}
/* Main app masthead becomes the whole site's visual anchor */
header.text-center {
  background: linear-gradient(120deg, rgba(25, 48, 104, .98) 0%, rgba(49, 46, 129, .95) 54%, rgba(154, 75, 30, .91) 100%) !important;
  border-color: rgba(251, 191, 36, .48) !important;
  box-shadow: 0 14px 38px rgba(3, 8, 25, .34), inset 0 1px rgba(255,255,255,.08) !important;
}
header h1 { color: #ffd19c !important; text-shadow: 0 0 22px rgba(251,146,60,.2); }
header .text-slate-400 { color: #d0defa !important; }
nav.grid {
  background: linear-gradient(100deg, rgba(18, 35, 79, .98), rgba(47, 32, 76, .97)) !important;
  border-color: rgba(129, 190, 255, .35) !important;
  box-shadow: 0 8px 22px rgba(0,0,0,.18);
}
/* Sasuke blue and Naruto orange are both visible across every page */
.bg-amber-400 { background-color: #fb923c !important; }
.hover\:bg-amber-300:hover { background-color: #fdba74 !important; }
.text-amber-300, .text-amber-200 { color: #ffd08a !important; }
.border-amber-500\/30, .border-amber-500\/20 { border-color: rgba(251, 146, 60, .48) !important; }
.bg-sky-400 { background-color: #75c9ff !important; }
.hover\:bg-sky-300:hover { background-color: #a5e0ff !important; }
.text-sky-200, .text-sky-100 { color: #bfe8ff !important; }
.border-sky-400\/30, .border-sky-400\/20 { border-color: rgba(96, 165, 250, .45) !important; }
button {
  transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
}
button:hover { filter: brightness(1.08); }
button:active { transform: translateY(1px); }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid #fdba74 !important; outline-offset: 2px;
}
input, select, textarea {
  background-color: rgba(7, 15, 37, .92) !important;
  color: #f2f7ff !important;
  border-color: rgba(125, 184, 255, .34) !important;
}
input::placeholder { color: #91a5cd !important; }
option { background: #111b3d; color: #f2f7ff; }
/* Card outlines and visual separation */
.rounded-xl.border, .rounded-2xl.border { box-shadow: 0 7px 22px rgba(2, 7, 22, .14); }
.text-slate-400 { color: #b9c9e8 !important; }
.text-slate-500 { color: #9aaed4 !important; }
.text-slate-300 { color: #d3def5 !important; }
.text-slate-200 { color: #e4edff !important; }
footer { color: #9eb2d9 !important; }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }

</head>
<body class="text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const STORAGE_KEY = "sasunarulog_records_v4";
    const SETTINGS_KEY = "sasunarulog_settings_v1";
    const SAVINGS_GOALS_KEY = "sasunarulog_savings_goals_v1";
    const SAVINGS_TX_KEY = "sasunarulog_savings_transactions_v1";
    const MONTHLY_CLOSINGS_KEY = "sasunarulog_monthly_closings_v1";
    const money = n => new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 2 }).format(Number(n || 0));
    // 所有系統日期統一使用台灣時區，避免裝置時區或 UTC 跨日造成日期落差。
    const todayLocal = () => {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      const part = type => parts.find(p => p.type === type)?.value || "00";
      return `${part("year")}-${part("month")}-${part("day")}`;
    };
    const todayDisplay = value => {
      const d = new Date(`${value}T12:00:00+08:00`);
      const weekdays = ["日","一","二","三","四","五","六"];
      return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（星期${weekdays[d.getDay()]}）`;
    };
    const safeRead = (key, fallback) => {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch (e) { return fallback; }
    };
    const dateLabel = value => {
      if (!value) return "";
      const d = new Date(value + (value.length === 10 ? "T12:00:00" : ""));
      if (Number.isNaN(d.getTime())) return value;
      const weekdays = ["日","一","二","三","四","五","六"];
      return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}(${weekdays[d.getDay()]})`;
    };
    const startOfWeek = date => {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() - d.getDay()); // Sunday as first day
      d.setHours(0,0,0,0);
      return d;
    };

    function App() {
      const [records, setRecords] = useState(() => safeRead(STORAGE_KEY, []));
      const [savingsGoals, setSavingsGoals] = useState(() => {
        const goals = safeRead(SAVINGS_GOALS_KEY, []);
        const piggy = goals.find(g => g.monthlyClosePiggyBank || g.name === "存錢筒");
        if (piggy) { piggy.monthlyClosePiggyBank = true; return goals; }
        return [{ id: "sasunaru-monthly-piggy-bank", group: "其他", name: "存錢筒", target: 0, monthly: 0, monthlyClosePiggyBank: true, createdAt: new Date().toISOString() }, ...goals];
      });
      const [savingsTransactions, setSavingsTransactions] = useState(() => safeRead(SAVINGS_TX_KEY, []));
      const [monthlyClosings, setMonthlyClosings] = useState(() => safeRead(MONTHLY_CLOSINGS_KEY, []));
      const [closingMonth, setClosingMonth] = useState(() => todayLocal().slice(0,7));
      const [activeTab, setActiveTab] = useState("home");
      const [goalGroup, setGoalGroup] = useState("佐鳴周邊類");
      const [goalName, setGoalName] = useState("");
      const [goalTarget, setGoalTarget] = useState("");
      const [goalMonthly, setGoalMonthly] = useState("");
      const [editingGoalId, setEditingGoalId] = useState(null);
      const [editingGoalGroup, setEditingGoalGroup] = useState("佐鳴周邊類");
      const [editingGoalName, setEditingGoalName] = useState("");
      const [editingGoalTarget, setEditingGoalTarget] = useState("");
      const [editingGoalMonthly, setEditingGoalMonthly] = useState("");
      const [selectedGoalId, setSelectedGoalId] = useState("");
      const [savingAmount, setSavingAmount] = useState("");
      const [savingNote, setSavingNote] = useState("");
      const [savingAction, setSavingAction] = useState("deposit");
      const [savingSource, setSavingSource] = useState("balance");
      const [settings, setSettings] = useState(() => safeRead(SETTINGS_KEY, { dailyBudget: 500, monthlyBudget: 10000 }));
      const [type, setType] = useState("expense");
      const [amount, setAmount] = useState("");
      const [category, setCategory] = useState("日常用品－生活雜支");
      const [note, setNote] = useState("");
      const [currentDate, setCurrentDate] = useState(todayLocal());
      const [recordDate, setRecordDate] = useState(todayLocal());
      const [recordDateManual, setRecordDateManual] = useState(false);
      const [payment, setPayment] = useState("現金");
      const [range, setRange] = useState("day");
      const [weekdayMetric, setWeekdayMetric] = useState("total");
      const [electricMeterReading, setElectricMeterReading] = useState("");
      const [customDate, setCustomDate] = useState(todayLocal());
      const [customDateManual, setCustomDateManual] = useState(false);
      const [historyGroup, setHistoryGroup] = useState("month");
      const [ledgerYear, setLedgerYear] = useState(todayLocal().slice(0,4));
      const [dialog, setDialog] = useState("佐助：「吊車尾的，今天也把帳記好。有煩惱就說，除了算帳，我也會聽。」");
      const [editingId, setEditingId] = useState(null);
      const [budgetOpen, setBudgetOpen] = useState(false);
      const [dailyBudgetInput, setDailyBudgetInput] = useState(String(settings.dailyBudget ?? 500));
      const [monthlyBudgetInput, setMonthlyBudgetInput] = useState(String(settings.monthlyBudget ?? 10000));
      const [chatInput, setChatInput] = useState("");
      const [showCloudInfo, setShowCloudInfo] = useState(false);
      const [showImport, setShowImport] = useState(false);
      const [notice, setNotice] = useState("");

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
        catch (e) { setNotice("本機儲存失敗，請先匯出備份，避免資料遺失。"); }
      }, [records]);
      useEffect(() => {
        try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e) {}
      }, [settings]);
      useEffect(() => { try { localStorage.setItem(SAVINGS_GOALS_KEY, JSON.stringify(savingsGoals)); } catch(e) { setNotice("存錢目標儲存失敗，請先備份。"); } }, [savingsGoals]);
      useEffect(() => { try { localStorage.setItem(SAVINGS_TX_KEY, JSON.stringify(savingsTransactions)); } catch(e) { setNotice("存錢紀錄儲存失敗，請先備份。"); } }, [savingsTransactions]);
      useEffect(() => { try { localStorage.setItem(MONTHLY_CLOSINGS_KEY, JSON.stringify(monthlyClosings)); } catch(e) { setNotice("月結紀錄儲存失敗，請先備份。"); } }, [monthlyClosings]);
      // 每 30 秒檢查台灣日期；跨日後更新系統日期與未手動指定的日期欄位。
      useEffect(() => {
        const refreshTaiwanDate = () => {
          const nowDate = todayLocal();
          setCurrentDate(nowDate);
          if (!recordDateManual) setRecordDate(nowDate);
          if (!customDateManual) setCustomDate(nowDate);
        };
        refreshTaiwanDate();
        const timer = setInterval(refreshTaiwanDate, 30000);
        return () => clearInterval(timer);
      }, [recordDateManual, customDateManual]);

      const selectedRange = useMemo(() => {
        const chosen = new Date(customDate + "T12:00:00");
        const start = new Date(chosen.getFullYear(), chosen.getMonth(), chosen.getDate());
        const end = new Date(start);
        if (range === "day") end.setDate(end.getDate()+1);
        if (range === "week") {
          const s = startOfWeek(chosen);
          const e = new Date(s); e.setDate(e.getDate()+7);
          return { start:s, end:e, label:"本週" };
        }
        if (range === "month") {
          return { start:new Date(chosen.getFullYear(),chosen.getMonth(),1), end:new Date(chosen.getFullYear(),chosen.getMonth()+1,1), label:"本月" };
        }
        if (range === "year") {
          return { start:new Date(chosen.getFullYear(),0,1), end:new Date(chosen.getFullYear()+1,0,1), label:"本年" };
        }
        if (range === "all") return { start:new Date(0), end:new Date(8640000000000000), label:"全部紀錄" };
        return { start, end, label:"當日" };
      }, [range, customDate]);

      const filteredRecords = useMemo(() => records.filter(r => {
        const d = new Date((r.date || todayLocal()) + "T12:00:00");
        return d >= selectedRange.start && d < selectedRange.end;
      }).sort((a,b) => (b.date || "").localeCompare(a.date || "") || b.id-a.id), [records, selectedRange]);

      const ledgerTotals = useMemo(() => {
        const income = filteredRecords.filter(r => r.type === "income").reduce((s,r)=>s+Number(r.amount||0),0);
        // 存錢轉入會影響一般可用結餘，但不是消費；排除於消費統計與預算。
        const expense = filteredRecords.filter(r => r.type === "expense" && !r.savingsTransfer).reduce((s,r)=>s+Number(r.amount||0),0);
        const transferOut = filteredRecords.filter(r => r.type === "expense" && r.savingsTransfer && !r.monthlyCloseTransfer).reduce((s,r)=>s+Number(r.amount||0),0);
        const transferBack = filteredRecords.filter(r => r.type === "transfer_in" && r.savingsTransfer).reduce((s,r)=>s+Number(r.amount||0),0);
        return { income, expense, transferOut, transferBack, balance: income-expense-transferOut+transferBack };
      }, [filteredRecords]);
      const { income: totalIncome, expense: totalExpense, transferOut: transferOutTotal, transferBack: transferBackTotal, balance } = ledgerTotals;

      // 分析資料只統計真正消費，不把存錢轉移當成消費。
      const expenseRecords = useMemo(() => filteredRecords.filter(r => r.type === "expense" && !r.savingsTransfer), [filteredRecords]);
      const incomeRecords = useMemo(() => filteredRecords.filter(r => r.type === "income"), [filteredRecords]);
      const categoryTotals = useMemo(() => Object.entries(expenseRecords.reduce((acc,r) => {
        const key = r.category || "未分類";
        acc[key] = (acc[key] || 0) + Number(r.amount || 0);
        return acc;
      }, {})).map(([name,value]) => ({name,value}))
        .sort((a,b) => b.value-a.value), [expenseRecords]);
      const dailyTotals = useMemo(() => Object.entries(expenseRecords.reduce((acc,r) => {
        const key = r.date || "日期不明";
        acc[key] = (acc[key] || 0) + Number(r.amount || 0);
        return acc;
      }, {})).map(([date,value]) => ({date,value}))
        .sort((a,b) => a.date.localeCompare(b.date)), [expenseRecords]);
      const monthlyTotals = useMemo(() => Object.entries(expenseRecords.reduce((acc,r) => {
        const key = (r.date || "").slice(0,7) || "日期不明";
        acc[key] = (acc[key] || 0) + Number(r.amount || 0);
        return acc;
      }, {})).map(([month,value]) => ({month,value})).sort((a,b)=>a.month.localeCompare(b.month)), [expenseRecords]);
      const yearForMonthlyChart = Number(customDate.slice(0,4));
      const yearMonthlyChart = Array.from({length:12}, (_,i) => {
        const month = `${yearForMonthlyChart}-${String(i+1).padStart(2,"0")}`;
        const found = monthlyTotals.find(item => item.month === month);
        return {month, value: found ? found.value : 0};
      });
      const maxMonthlyValue = Math.max(1, ...yearMonthlyChart.map(m=>m.value));
      const maxCategory = categoryTotals[0];
      const maxExpenseDay = dailyTotals.reduce((best,item) => !best || item.value > best.value ? item : best, null);
      const recordedExpenseDays = dailyTotals.length;
      const averageExpensePerRecordedDay = recordedExpenseDays ? totalExpense / recordedExpenseDays : 0;
      const categoryMaxValue = Math.max(1, ...categoryTotals.map(c=>c.value));
      const dailyMaxValue = Math.max(1, ...dailyTotals.map(d=>d.value));
      // 星期開銷分析：只統計真正消費，排除存錢轉出與存款內部操作。
      // 「全部」範圍以目前帳本最早至最晚紀錄日期計算平均，避免掃描無限日期。
      const weekdayLabels = ["星期一","星期二","星期三","星期四","星期五","星期六","星期日"];
      const datedRecords = useMemo(() => records.filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date || "")).slice().sort((a,b)=>a.date.localeCompare(b.date)), [records]);
      const weekdayStart = range === "all" && datedRecords.length ? new Date(datedRecords[0].date + "T12:00:00") : new Date(selectedRange.start);
      const weekdayEnd = range === "all" && datedRecords.length ? new Date(datedRecords[datedRecords.length-1].date + "T12:00:00") : new Date(selectedRange.end);
      if (range === "all" && datedRecords.length) weekdayEnd.setDate(weekdayEnd.getDate()+1);
      const weekdayTotals = Array.from({length:7}, (_,i)=>({index:i,label:weekdayLabels[i],value:0,dayCount:0}));
      expenseRecords.forEach(r=>{
        if (!/^\d{4}-\d{2}-\d{2}$/.test(r.date || "")) return;
        const d = new Date(r.date + "T12:00:00");
        const idx = (d.getDay()+6)%7;
        weekdayTotals[idx].value += Number(r.amount||0);
      });
      if (weekdayStart instanceof Date && weekdayEnd instanceof Date && !Number.isNaN(weekdayStart.getTime()) && !Number.isNaN(weekdayEnd.getTime()) && weekdayStart < weekdayEnd && (range !== "all" || datedRecords.length)) {
        const cursor = new Date(weekdayStart.getFullYear(),weekdayStart.getMonth(),weekdayStart.getDate(),12);
        const end = new Date(weekdayEnd.getFullYear(),weekdayEnd.getMonth(),weekdayEnd.getDate(),12);
        while (cursor < end) {
          weekdayTotals[(cursor.getDay()+6)%7].dayCount += 1;
          cursor.setDate(cursor.getDate()+1);
        }
      }
      const weekdayTotalsWithAverage = weekdayTotals.map(item=>({...item,average:item.dayCount ? item.value/item.dayCount : 0}));
      const weekdayDisplayValue = item => weekdayMetric === "average" ? item.average : item.value;
      const weekdayMaxValue = Math.max(1, ...weekdayTotalsWithAverage.map(weekdayDisplayValue));
      const weekdayHighest = weekdayTotalsWithAverage.reduce((best,item)=>!best || weekdayDisplayValue(item)>weekdayDisplayValue(best)?item:best,null);
      const analysisSummary = expenseRecords.length === 0
        ? "這個統計範圍還沒有支出紀錄。先持續記帳，資料累積後就能看出消費趨勢。"
        : `${selectedRange.label}共記錄 ${expenseRecords.length} 筆支出，合計 NT$${money(totalExpense)}；${maxCategory ? `支出最高的類別是「${maxCategory.name}」，共 NT$${money(maxCategory.value)}（${totalExpense ? (maxCategory.value/totalExpense*100).toFixed(1) : "0.0"}%）。` : ""}${maxExpenseDay ? `單日最高支出為 ${dateLabel(maxExpenseDay.date)}，NT$${money(maxExpenseDay.value)}。` : ""}有支出的日期平均每天 NT$${money(averageExpensePerRecordedDay)}。${incomeRecords.length ? `同期收入 NT$${money(totalIncome)}，收支結餘 NT$${money(balance)}。` : "目前此範圍沒有收入紀錄，結餘只反映已記錄的支出。"}`;

      const todayExpense = useMemo(() => records.filter(r => r.type==="expense" && !r.savingsTransfer && r.date===currentDate).reduce((s,r)=>s+Number(r.amount||0),0), [records, currentDate]);
      // 一般消費仍用於預算與消費分析；存錢轉入另外計入「總流出」，避免誤以為這筆錢仍可花用。
      const monthExpense = useMemo(() => records.filter(r => r.type==="expense" && !r.savingsTransfer && r.date && r.date.slice(0,7)===currentDate.slice(0,7)).reduce((s,r)=>s+Number(r.amount||0),0), [records, currentDate]);
      const monthSavingsTransfer = useMemo(() => records.filter(r => r.type==="expense" && r.savingsTransfer && !r.monthlyCloseTransfer && r.date && r.date.slice(0,7)===currentDate.slice(0,7)).reduce((s,r)=>s+Number(r.amount||0),0), [records, currentDate]);
      const monthIncome = useMemo(() => records.filter(r => r.type==="income" && r.date && r.date.slice(0,7)===currentDate.slice(0,7)).reduce((s,r)=>s+Number(r.amount||0),0), [records, currentDate]);
      const monthTransferBack = useMemo(() => records.filter(r => r.type==="transfer_in" && r.savingsTransfer && r.date && r.date.slice(0,7)===currentDate.slice(0,7)).reduce((s,r)=>s+Number(r.amount||0),0), [records, currentDate]);
      // 本月結餘＝收入－一般消費－從結餘存入＋舊版存款轉回；存錢轉入不混入支出。
      const monthBalance = monthIncome - monthExpense - monthSavingsTransfer + monthTransferBack;
      const budgetProgress = settings.monthlyBudget > 0 ? Math.min(100, monthExpense / settings.monthlyBudget * 100) : 0;

        if (goalBalance(goal.id)!==0) { setNotice("這個目標還有餘額，請先提領或使用完再刪除，避免存款紀錄失去對應。"); return; }
        if (window.confirm(`確定刪除存錢目標「${goal.name}」？`)) { setSavingsGoals(prev=>prev.filter(g=>g.id!==goal.id)); setSavingsTransactions(prev=>prev.filter(t=>String(t.goalId)!==String(goal.id))); setNotice("存錢目標已刪除。"); }
      }

      function chatSend(message=chatInput) {
        const m=String(message || "").trim(); if(!m) return;
        const lower=m.toLowerCase();
        const expenseByCategory = Object.entries(records.filter(r=>r.type==="expense" && !r.savingsTransfer && r.date && r.date.slice(0,7)===todayLocal().slice(0,7)).reduce((acc,r)=>{const k=r.category||"未分類";acc[k]=(acc[k]||0)+Number(r.amount||0);return acc;},{})).sort((a,b)=>b[1]-a[1]);
        const biggest = records.filter(r=>r.type==="expense" && r.date && r.date.slice(0,7)===todayLocal().slice(0,7)).sort((a,b)=>Number(b.amount)-Number(a.amount))[0];
        if(/你好|嗨|哈囉|早安|晚安|在嗎|在不在/.test(m)) {
          setDialog("鳴人：「我在我在！想聊什麼都可以！」\n佐助：「……我也在。要算帳、想買東西，還是今天心情不好，都可以說。」");
        } else if(/謝謝|感謝|愛你|喜歡你|親|抱抱/.test(m)) {
          setDialog("鳴人：「嘿嘿！有人陪著真的很棒吧！」\n佐助：「不用道謝。妳願意把事情說出來就好。……過來，抱一下。別什麼都自己扛。」");
        } else if(/難過|不開心|壓力|焦慮|煩|累|崩潰|哭/.test(m)) {
          setDialog("佐助：「先停一下，呼吸。現在不必立刻把所有問題解決。想說就慢慢說，我會聽。記帳不是拿來責備自己的，花了錢也不代表妳做錯了什麼。」");
        } else if(/今天|今日/.test(m) && /花|支出|多少|帳/.test(m)) {
          setDialog(`佐助：「今天目前支出 NT$${money(todayExpense)}。${todayExpense>settings.dailyBudget ? "已超過每日預算，先暫停非必要消費，別急著責怪自己。" : `距離每日預算還有 NT$${money(Math.max(0,settings.dailyBudget-todayExpense))}。`} 如果有漏記，現在補上就好。」`);
        } else if(/收入|賺|薪水|打工/.test(m)) {
          const incomeThisMonth=records.filter(r=>r.type==="income" && r.date && r.date.slice(0,7)===todayLocal().slice(0,7)).reduce((s,r)=>s+Number(r.amount||0),0);
          setDialog(`佐助：「本月已記錄收入 NT$${money(incomeThisMonth)}，本月支出 NT$${money(monthExpense)}。目前紀錄的收支差額是 NT$${money(incomeThisMonth-monthExpense)}。先把必要開銷留好，再決定剩下的錢怎麼用。」`);
        } else if(/預算|剩下|剩多少|還能花/.test(m)) {
          setDialog(`佐助：「本月支出 NT$${money(monthExpense)}，月預算是 NT$${money(settings.monthlyBudget)}。${monthExpense>settings.monthlyBudget?`已超出 NT$${money(monthExpense-settings.monthlyBudget)}。先暫停非必要消費，看看哪些項目可以延後。`:`還剩 NT$${money(Math.max(0,settings.monthlyBudget-monthExpense))}，已使用 ${settings.monthlyBudget>0?(monthExpense/settings.monthlyBudget*100).toFixed(1):"0.0"}%。`} 預算是參考，不是拿來罵自己的。」`);
        } else if(/分類|哪一類|花最多|最高支出|最大筆|最貴/.test(m)) {
          if(/最大筆|最貴/.test(m) && biggest) setDialog(`佐助：「本月目前最大的一筆支出是「${biggest.note||biggest.category}」，分類 ${biggest.category}，金額 NT$${money(biggest.amount)}。先確認這筆是不是必要開銷，再決定要不要調整。」`);
          else if(expenseByCategory.length) setDialog(`佐助：「本月支出最多的分類是「${expenseByCategory[0][0]}」，共 NT$${money(expenseByCategory[0][1])}。${expenseByCategory.length>1?`第二名是「${expenseByCategory[1][0]}」，NT$${money(expenseByCategory[1][1])}。`:""}分類高不代表一定浪費，還要看實際用途。」`);
          else setDialog("佐助：「本月還沒有支出紀錄。先記幾筆，等資料累積起來，我才能幫妳看出消費趨勢。」");
        } else if(/省錢|存錢|節省|怎麼辦|建議|改善/.test(m)) {
          setDialog("佐助：「先做三件事：一、把固定必要支出和想買的東西分開；二、非急需的商品先放購物車一天；三、替每週的飲料、甜點或娛樂設一個妳做得到的上限。不要一下訂太嚴格，能持續比較重要。」");
        } else if(/買|購物|下單|想要|值得|衝動/.test(m)) {
          setDialog("佐助：「先回答我三個問題：這是現在就需要的嗎？買完會不會影響吃飯、交通或帳單？如果等三天再買，會有實際損失嗎？如果都不是急事，就先放三天。真的想要也沒關係，重點是清楚自己為什麼買。」");
        } else if(/分析|月報|總結|整理/.test(m)) {
          setDialog(`佐助：「本月目前收入已記錄金額請以明細為準；支出共 NT$${money(monthExpense)}。${expenseByCategory.length?`主要支出是「${expenseByCategory[0][0]}」NT$${money(expenseByCategory[0][1])}。`:"目前還沒有支出分類資料。"} ${monthExpense>settings.monthlyBudget?"這個月已超出預算，可以先檢視非必要支出。":"繼續記錄幾天，再比較各類支出會更準確。"} 不需要追求完美，先維持記帳習慣。」`);
        } else if(/幫助|可以做什麼|功能|怎麼用/.test(m)) {
          setDialog("鳴人：「可以問今天花多少、本月預算、收入、哪類花最多，也可以跟我們聊心情或購物猶豫！」\n佐助：「試著輸入：『今天花多少』、『本月分類分析』、『我想買一個東西』、『我最近壓力很大』或『教我怎麼省錢』。我會依照目前記帳資料和關鍵字回覆；這是本機規則式聊天，還不是連線 AI。」");
        } else {
          setDialog("佐助：「我在聽。妳可以跟我聊今天的心情、猶豫要不要買東西、怎麼安排預算，或直接問我本月支出和分類分析。若是記帳問題，說得越具體，我越能依照現有紀錄幫妳。」");
        }
        setChatInput("");
      }

              <label className="block text-xs text-slate-400">金額（NT$）<input required type="number" min="0.01" step="0.01" value={savingAmount} onChange={e=>setSavingAmount(e.target.value)} placeholder="輸入金額" className="mt-1 w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm"/></label>
              <label className="block text-xs text-slate-400">備註／用途<input value={savingNote} onChange={e=>setSavingNote(e.target.value)} placeholder={savingAction==="deposit"?"例如：本月存錢／額外零用錢":"例如：購買佐鳴立牌／繳電費"} className="mt-1 w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm"/></label>
              <p className="text-xs text-slate-400">{savingAction==="deposit"?(savingSource==="extra"?"額外收入只增加此存錢目標，不會新增一般收入，也不影響一般收支結餘。":"從收支結餘存入：一般可用結餘減少，存錢目標增加；不列為一般消費、分類分析或預算。外部收入請選「額外收入」。"):(savingsGoals.some(g=>String(g.id)===String(selectedGoalId)&&isMonthlyPiggyBank(g))?"存錢筒支出會記錄在專屬帳目與分析中，不會列入一般收支支出。":"使用存款只扣除所選存錢目標，不會在一般記帳新增支出。")}</p>
              <button className="w-full bg-sky-400 hover:bg-sky-300 text-slate-950 font-black rounded-lg py-2.5">確認操作</button>
            </form>
          </section>

          <section className="bg-blue-950/50 border border-blue-400/20 rounded-xl p-3 text-xs text-slate-300 space-y-1"><div className="font-bold text-blue-200">🩵存錢所總覽</div><p>這裡的「存錢所剩」只計算存錢目標內的餘額，不會加進一般收支結餘。使用存款只扣除該目標，不新增一般支出。新版不再提供「轉回」功能。</p></section>
        </div>}

        <footer className="text-center text-[11px] text-slate-500 pt-2">佐鳴記帳所 V15 · 存錢筒額外存入／年度月報 · 資料保存在目前瀏覽器</footer>
      </div>;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
